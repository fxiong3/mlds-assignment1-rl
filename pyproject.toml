[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlds-assignment1"
version = "0.1.0"
description = "Dynamic programming and policy-gradient experiments for MLDS Assignment 1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ale-py>=0.10,<0.12",
  "gymnasium[accept-rom-license,atari,classic-control]>=1.0,<1.3",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
mlds-dp = "mlds_assignment1.dp.cli:main"
mlds-train = "mlds_assignment1.rl.train:main"
mlds-evaluate = "mlds_assignment1.rl.evaluate:main"
mlds-plot = "mlds_assignment1.rl.plotting:main"
mlds-validate = "mlds_assignment1.rl.validation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlds_assignment1"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=mlds_assignment1 --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

